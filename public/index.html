<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Verbo & Hino</title>
  <meta name="description" content="Quiz gamificado para estudar a Bíblia (ARC) e o Hinário da CCB. Identifique referências bíblicas e hinos em modos Clássico, Sobrevivência e Relógio." />
  <meta name="theme-color" content="#13141f" />
  <meta property="og:title" content="Verbo & Hino" />
  <meta property="og:description" content="Quiz gamificado de Bíblia (ARC) e Hinário da CCB — web e mobile com Expo." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://verbo-hino.vercel.app/" />
  <meta property="og:image" content="https://verbo-hino.vercel.app/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Verbo & Hino" />
  <meta name="twitter:description" content="Quiz gamificado de Bíblia (ARC) e Hinário da CCB." />
  <meta name="twitter:image" content="https://verbo-hino.vercel.app/og-image.png" />
  <link rel="canonical" href="https://verbo-hino.vercel.app/" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body { overflow: hidden; display: flex; flex-direction: column; }
    #root { display: flex; flex: 1; min-height: 0; }
    #vh-header {
      background: linear-gradient(135deg, #13141f 0%, #1e1f29 100%);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      border-bottom: 1px solid #2a2b3a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      flex-shrink: 0;
    }
    #vh-header .name {
      color: #bd93f9;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.3px;
    }
    #vh-header .badges { display: flex; gap: 6px; }
    #vh-header .badge {
      background: #2a2b3a;
      color: #8be9fd;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }
    #vh-header .links { margin-left: auto; display: flex; gap: 14px; }
    #vh-header .links a {
      color: #f8f8f2;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    #vh-header .links a:hover { opacity: 0.7; }
    #vh-header .links a.github { color: #50fa7b; }
    @media (max-width: 520px) {
      #vh-header { padding: 8px 12px; gap: 8px; }
      #vh-header .name { font-size: 15px; }
      #vh-header .badges { display: none; }
      #vh-header .links { gap: 10px; }
      #vh-header .links a { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="vh-header">
    <span class="name">Verbo &amp; Hino</span>
    <span class="badges">
      <span class="badge">React Native</span>
      <span class="badge">Expo</span>
    </span>
    <span class="links">
      <a href="https://barujafe.vercel.app/" target="_blank" rel="noopener">← Portfólio</a>
      <a href="https://github.com/BarujaFe1/VerboHino" target="_blank" rel="noopener" class="github">GitHub ↗</a>
    </span>
  </div>
  <div id="root"></div>
</body>
</html>
